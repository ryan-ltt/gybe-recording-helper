name: Update shows

on:
  schedule:
    - cron: '0 8 * * *'   # daily at 8am UTC
  workflow_dispatch:       # allow manual trigger from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check for new shows and recordings
        run: python update-shows.py --skip-prune

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install prediction deps
        continue-on-error: true
        run: npm install --no-save @supabase/supabase-js

      # never let a predictions failure stop the setlist commit below: the site's
      # core data must land even if supabase is unreachable.
      - name: Open and settle prediction markets
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node sync-predictions.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add setlists.json .last-update last-update.js changelog.json
          git diff --staged --quiet && echo "Nothing to commit." || \
            git commit -m "chore: update shows and recordings [skip ci]"
          git push

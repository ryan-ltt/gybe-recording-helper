name: Update bands

on:
  schedule:
    - cron: '30 8 * * *'   # daily at 8:30am UTC (30 min after GY!BE job)
  workflow_dispatch:        # allow manual trigger from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update each non-legacy band
        run: |
          python - <<'EOF'
          import json, subprocess, sys

          with open('bands.json') as f:
              bands = json.load(f)['bands']

          failed = []
          for band in bands:
              if band.get('managed_by') == 'legacy':
                  continue
              slug = band['slug']
              print(f'\n=== {band["name"]} ({slug}) ===')

              r1 = subprocess.run(
                  [sys.executable, 'scrape-setlistfm.py', '--band', slug],
                  capture_output=False,
              )
              if r1.returncode != 0:
                  print(f'scrape-setlistfm.py failed for {slug} (exit {r1.returncode}) — continuing')
                  failed.append(f'{slug}:scrape')

              r2 = subprocess.run(
                  [sys.executable, 'update-band-recordings.py', '--band', slug],
                  capture_output=False,
              )
              if r2.returncode != 0:
                  print(f'update-band-recordings.py failed for {slug} (exit {r2.returncode}) — continuing')
                  failed.append(f'{slug}:recordings')

          if failed:
              print(f'\nFailed steps: {failed}')
              sys.exit(1)
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '*_setlists.json' '.*-last-update' || true
          git diff --staged --quiet && echo "Nothing to commit." || \
            git commit -m "chore: update bands [skip ci]"
          git push

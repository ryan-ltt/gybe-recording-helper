name: Prune dead recordings

on:
  schedule:
    - cron: '0 8 * * 1'   # weekly on Monday at 8am UTC
  workflow_dispatch:       # allow manual trigger from the Actions tab

jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check for dead recordings
        run: python update-shows.py --prune-only

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add setlists.json changelog.json
          git diff --staged --quiet && echo "Nothing to commit." || \
            git commit -m "chore: prune dead recordings [skip ci]"
          git push

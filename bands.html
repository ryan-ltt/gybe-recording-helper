<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>recording helper</title>
    <link rel="stylesheet" href="index.css">
    <style>
        .era-block {
            border: 2px solid black;
            background: white;
            margin-bottom: 12px;
        }
        .era-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 14px 18px;
            cursor: pointer;
            user-select: none;
        }
        .era-header:hover { background: #f5f5f5; }
        .era-title {
            font-family: Monaco, 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: bold;
        }
        .era-meta {
            font-family: Monaco, 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #555;
            text-align: right;
        }
        .era-toggle {
            font-family: Monaco, 'JetBrains Mono', monospace;
            font-size: 16px;
            margin-left: 12px;
        }
        .era-body {
            display: none;
            border-top: 2px solid black;
            padding: 14px 18px;
        }
        .era-body.open { display: block; }
        .era-shows { margin-top: 8px; }
        .era-show-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-family: Monaco, 'JetBrains Mono', monospace;
            font-size: 12px;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
            gap: 12px;
        }
        .era-show-date { font-weight: bold; white-space: nowrap; }
        .era-show-venue { color: #555; flex: 1; }
        .era-show-recs { white-space: nowrap; }
        .era-show-recs a { color: #0066cc; text-decoration: none; border-bottom: 1px solid #0066cc; margin-left: 6px; }
        .era-show-recs a:hover { color: #004499; }
        .era-show-toggle { cursor: pointer; color: #999; font-size: 14px; padding: 0 4px; user-select: none; }
        .era-show-toggle:hover { color: black; }
        .era-show-setlist {
            display: none;
            padding: 6px 0 4px 0;
            font-family: Monaco, 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #444;
            line-height: 1.9;
            border-bottom: 1px solid #eee;
        }
        .era-show-setlist.open { display: block; }
        .era-filter { margin-bottom: 10px; }
        .era-filter input {
            padding: 5px 10px;
            font-family: Monaco, 'JetBrains Mono', monospace;
            font-size: 12px;
            border: 2px solid black;
            background: white;
            width: 100%;
            max-width: 300px;
            box-sizing: border-box;
        }
        .era-filter input:focus { outline: none; background: #f5f5ff; }

        html.dark .era-block { border-color: #2c3e50; background: #1e2a38; }
        html.dark .era-header:hover { background: #253545; }
        html.dark .era-meta { color: #eaf2f5; }
        html.dark .era-body { border-top-color: #2c3e50; }
        html.dark .era-show-row { border-bottom-color: #2c3e50; }
        html.dark .era-show-venue { color: #eaf2f5; }
        html.dark .era-show-recs a { color: #6aadff; border-bottom-color: #6aadff; }
        html.dark .era-show-recs a:hover { color: #8fc4ff; }
        html.dark .era-show-toggle { color: #b8ccd6; }
        html.dark .era-show-toggle:hover { color: #eaf2f5; }
        html.dark .era-show-setlist { color: #eaf2f5; border-bottom-color: #2c3e50; }
        html.dark .era-filter input { border-color: #2c3e50; background: #1e2a38; color: #eaf2f5; }
        html.dark .era-filter input:focus { background: #0e1824; }
    </style>
</head>
<body>
    <header>
        <div class="header-title">
            <h1>recording helper</h1>
            <p class="header-subtitle"><a href="index.html">← back to gybe</a></p>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
            <button class="header-btn" id="themeToggle" onclick="toggleTheme()" title="toggle dark mode">◑</button>
        </div>
    </header>

    <main style="max-width:900px;margin:0 auto;padding:0 40px 40px;">
        <p>setlists from <a href="https://setlist.fm">setlist.fm</a> · recordings from <a href="https://archive.org">archive.org</a>.</p>

        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-bottom:20px;font-family:Monaco,'JetBrains Mono',monospace;font-size:13px;">
            <label>band: <select id="bandPicker" onchange="onBandChange(this.value)" style="font-family:Monaco,'JetBrains Mono',monospace;font-size:13px;border:2px solid black;padding:3px 6px;"></select></label>
            <span id="bandsLastUpdated" style="color:#888;font-size:11px;"></span>
            <label><input type="checkbox" id="bandsRecordingsOnly" onchange="buildBandEras()"> recordings only</label>
            <label><input type="checkbox" id="bandsSetlistsOnly" onchange="buildBandEras()"> setlists only</label>
        </div>

        <div id="bandsContainer"></div>
    </main>

    <script src="bands.js"></script>
    <script>
        function toggleTheme() {
            const dark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', dark ? 'dark' : 'light');
        }
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
</body>
</html>
